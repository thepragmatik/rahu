<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 530" width="940" height="530" role="img" aria-labelledby="t d">
<title id="t">Rahu modules and dependency direction</title>
<desc id="d">Architecture diagram for Rahu modules and dependency direction. Colours carry meaning: blue is structure, teal is verified evidence, amber is degraded or risky, violet is an external boundary.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5aa2ff"/>
  </marker>
  <marker id="arrowV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
  </marker>
  <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#e3a008"/>
  </marker>
</defs>
<rect width="940" height="530" fill="#0d1117" rx="12"/>
<text x="24" y="30" style="font:700 15px -apple-system,Segoe UI,sans-serif" fill="#e6edf3">Modules and dependency direction</text>
<text x="24" y="49" style="font:400 11.5px ui-monospace,Menlo,monospace" fill="#6b7885">arrows point at the module being depended ON. rahu-core has no dependency beyond the JDK.</text>
<rect x="300" y="70" width="340" height="62" rx="8" fill="#161b22" stroke="#5aa2ff" stroke-width="1.6"/>
<rect x="300" y="70" width="3.5" height="62" rx="1.75" fill="#5aa2ff"/>
<text x="316" y="95" class="d-label" style="font:600 13px -apple-system,Segoe UI,Roboto,sans-serif">rahu-cli</text>
<text x="316" y="113" style="font:400 10.5px ui-monospace,Menlo,monospace" fill="#9aa7b4">composition, commands, persistence</text>
<rect x="90" y="190" width="340" height="76" rx="8" fill="#161b22" stroke="#a78bfa" stroke-width="1.6"/>
<rect x="90" y="190" width="3.5" height="76" rx="1.75" fill="#a78bfa"/>
<text x="106" y="215" class="d-label" style="font:600 13px -apple-system,Segoe UI,Roboto,sans-serif">rahu-openrouter</text>
<text x="106" y="233" style="font:400 10.5px ui-monospace,Menlo,monospace" fill="#9aa7b4">catalog, generation HTTP,</text>
<text x="106" y="247" style="font:400 10.5px ui-monospace,Menlo,monospace" fill="#9aa7b4">continuation envelope</text>
<rect x="510" y="190" width="340" height="76" rx="8" fill="#161b22" stroke="#a78bfa" stroke-width="1.6"/>
<rect x="510" y="190" width="3.5" height="76" rx="1.75" fill="#a78bfa"/>
<text x="526" y="215" class="d-label" style="font:600 13px -apple-system,Segoe UI,Roboto,sans-serif">rahu-systemone</text>
<text x="526" y="233" style="font:400 10.5px ui-monospace,Menlo,monospace" fill="#9aa7b4">decision HTTP protocol,</text>
<text x="526" y="247" style="font:400 10.5px ui-monospace,Menlo,monospace" fill="#9aa7b4">response validation</text>
<rect x="300" y="330" width="340" height="88" rx="8" fill="#161b22" stroke="#3fb9a5" stroke-width="1.6"/>
<rect x="300" y="330" width="3.5" height="88" rx="1.75" fill="#3fb9a5"/>
<text x="316" y="355" class="d-label" style="font:600 13px -apple-system,Segoe UI,Roboto,sans-serif">rahu-core</text>
<text x="316" y="373" style="font:400 10.5px ui-monospace,Menlo,monospace" fill="#9aa7b4">domain types, authority, ledgers,</text>
<text x="316" y="387" style="font:400 10.5px ui-monospace,Menlo,monospace" fill="#9aa7b4">routing, tools, privacy — JDK only</text>
<rect x="300" y="470" width="340" height="58" rx="8" fill="#161b22" stroke="#8892a0" stroke-width="1.6"/>
<rect x="300" y="470" width="3.5" height="58" rx="1.75" fill="#8892a0"/>
<text x="316" y="495" class="d-label" style="font:600 13px -apple-system,Segoe UI,Roboto,sans-serif">JDK</text>
<text x="316" y="513" style="font:400 10.5px ui-monospace,Menlo,monospace" fill="#9aa7b4">no JSON library, no HTTP client</text>
<path d="M420,132 L300,190" fill="none" stroke="#5aa2ff" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<path d="M520,132 L680,190" fill="none" stroke="#5aa2ff" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<path d="M260,266 L380,330" fill="none" stroke="#5aa2ff" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<path d="M680,266 L560,330" fill="none" stroke="#5aa2ff" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<path d="M470,418 L470,470" fill="none" stroke="#3d4855" stroke-width="1.6" stroke-linecap="round"/>
<text x="24" y="440" style="font:600 10.5px ui-monospace,Menlo,monospace" fill="#3fb9a5">VERIFIED: no jackson / java.net.http import exists in rahu-core/src/main/java</text>
<rect x="24" y="481" width="10" height="10" rx="3" fill="#5aa2ff"/>
<text x="40" y="490" style="font:400 11px -apple-system,Segoe UI,sans-serif" fill="#9aa7b4">composition</text>
<rect x="113.1" y="481" width="10" height="10" rx="3" fill="#a78bfa"/>
<text x="129.1" y="490" style="font:400 11px -apple-system,Segoe UI,sans-serif" fill="#9aa7b4">adapters: JSON + HTTP live here</text>
<rect x="324.2" y="481" width="10" height="10" rx="3" fill="#3fb9a5"/>
<text x="340.2" y="490" style="font:400 11px -apple-system,Segoe UI,sans-serif" fill="#9aa7b4">deterministic authority</text>
<rect x="486.5" y="481" width="10" height="10" rx="3" fill="#8892a0"/>
<text x="502.5" y="490" style="font:400 11px -apple-system,Segoe UI,sans-serif" fill="#9aa7b4">platform</text>
</svg>
